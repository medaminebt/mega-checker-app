<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    PRIVATE APP — keep it out of search engines, AI crawlers and link previews.
    Also see robots.txt, llms.txt and _headers (X-Robots-Tag) in this folder.
  -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <!-- Don't tell the sites it links to (mega.nz upload folders) where you came from. -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Private app.">

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mega-checker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: the glowing red MEGA "M" (generated by tool/generate_icons.swift) -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>mega-checker-app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Black canvas + glowing logo while Flutter loads (no white flash). */
    html, body { margin: 0; height: 100%; background: #000; }
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    #splash img {
      width: 72px; height: 72px; border-radius: 18px;
      filter: drop-shadow(0 6px 22px rgba(217, 39, 46, .55));
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <noscript style="color:#a6a6af;font-family:sans-serif;display:block;padding:24px">
    This app needs JavaScript.
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide the splash as soon as Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
</body>
</html>
