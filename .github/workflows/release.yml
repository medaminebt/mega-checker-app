# Builds the downloads for a GitHub release and attaches them to it:
#
#   mega-checker-app-macos.dmg         macOS installer (Apple Silicon): a window
#                                      with the app, a "Drag to install" arrow
#                                      and the Applications folder
#   mega-checker-app-windows-x64.zip   Windows app folder
#   mega-checker-app-web.zip           web build (upload to a static host)
#   SHA256SUMS.txt                     checksums of the files above
#
# Runs when a release is published (gh release create vX.Y.Z …, or the
# Releases page), or by hand: Actions → Release builds → Run workflow → tag
# (and optionally a newer branch / commit to build, e.g. to fix packaging).
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach files to (e.g. v1.0.0)
        required: true
      ref:
        description: Branch or commit to build instead of the tag (optional)
        required: false
        default: ''

permissions:
  contents: write # upload release assets

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
  FLUTTER_VERSION: 3.44.6
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags live

  web:
    name: Web
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Bundles the renderer instead of loading it from Google's CDN.
      - run: flutter build web --release --no-web-resources-cdn
      - name: Zip (files at the root of the zip, ready for Cloudflare Pages / Netlify)
        run: |
          mkdir -p dist
          (cd build/web && zip -qr ../../dist/mega-checker-app-web.zip .)
      - run: gh release upload "$TAG" dist/mega-checker-app-web.zip --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the Release folder (the .exe needs its DLLs and data folder)
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$src\mega-checker-app.exe")) { throw "mega-checker-app.exe not found in $src" }
          New-Item -ItemType Directory -Force -Path dist\mega-checker-app | Out-Null
          Copy-Item -Recurse -Force "$src\*" dist\mega-checker-app\
          Compress-Archive -Force -Path dist\mega-checker-app -DestinationPath dist\mega-checker-app-windows-x64.zip
      - shell: bash
        run: gh release upload "$TAG" dist/mega-checker-app-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package the installer .dmg (drag-to-Applications window)
        run: |
          # hdiutil is sometimes "busy" on CI runners; try a few times.
          for attempt in 1 2 3; do
            tool/make_dmg.sh build/macos/Build/Products/Release/mega-checker-app.app \
              dist/mega-checker-app-macos.dmg && exit 0
            echo "make_dmg failed (attempt $attempt), retrying…"; sleep 10
          done
          exit 1
      - run: gh release upload "$TAG" dist/mega-checker-app-macos.dmg --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    name: Checksums
    needs: [web, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SHA256SUMS.txt
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'mega-checker-app-*'
          sha256sum mega-checker-app-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
