name: mega_keepalive
description: "Keep MEGA accounts alive: logs in, records last login + storage in Supabase. macOS, Windows and web."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  csv: ^8.0.0                 # CSV import / export (handles quoted fields)
  supabase_flutter: ^2.18.3   # Supabase (Postgres) database + auth
  shared_preferences: ^2.5.6  # local settings (Supabase URL/key, UI prefs)
  file_selector: ^1.1.0       # CSV open / save dialogs (macOS, Windows, web)
  url_launcher: ^6.3.3        # opens upload folder links in the browser
  cryptography: ^2.9.0        # AES-256-GCM + PBKDF2 for the master password (Web Crypto in browsers)
  qr_flutter: ^4.1.0          # QR code for setting up 2FA in an authenticator app
  web: ^1.1.1                 # sessionStorage ("sign out when the browser closes")
  ffi: ^2.2.0                 # Windows DPAPI ("remember the master password on this PC")
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Lexend (SIL Open Font License — assets/fonts/OFL.txt), bundled so the app
  # never downloads fonts at runtime.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
